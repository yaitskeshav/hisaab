name: Expo CI/CD (staging)

on:
  push:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: expo-staging
  cancel-in-progress: true

jobs:
  ota_update:
    name: OTA Update (production channel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # (Optional) If google-services.json is not committed, reconstruct it from a secret
      - name: Restore google-services.json (if provided)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > google-services.json

      - name: Publish OTA update to production channel
        run: |
          npx eas update \
            --channel production \
            --message "staging: ${{ github.sha }}"

  build_apk:
    name: Build APK + GitHub Release (only on [build])
    runs-on: ubuntu-latest
    needs: ota_update

    if: contains(github.event.head_commit.message, '[build]')

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore google-services.json (if provided)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > google-services.json

      - name: Build APK (production profile)
        run: |
          npx eas build \
            -p android \
            --profile production \
            --non-interactive \
            --wait

      - name: Download build artifact
        run: |
          npx eas build:list --platform android --limit 1 --json > builds.json
          BUILD_URL=$(node -e "const b=require('./builds.json')[0]; console.log(b.artifacts.buildUrl || b.artifacts.applicationArchiveUrl || '')")
          echo "Build URL: $BUILD_URL"
          if [ -z "$BUILD_URL" ]; then
            echo "Could not determine artifact URL from EAS output."
            cat builds.json
            exit 1
          fi
          curl -L "$BUILD_URL" -o app-artifact.tar.gz
          mkdir -p out
          tar -xzf app-artifact.tar.gz -C out || true
          find out -type f

      - name: Locate APK
        run: |
          APK_PATH=$(find out -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in artifact"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}
          name: "Staging APK #${{ github.run_number }}"
          body: |
            Commit: ${{ github.sha }}
            Trigger: push to staging with [build] tag
            OTA: pushed to production channel
          files: |
            frontend/${{ env.APK_PATH }}
