name: Build APK (No EAS)

on:
  push:
    branches:
      - staging
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]') || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPPORT_EMAIL=${{ secrets.EXPO_PUBLIC_SUPPORT_EMAIL }}" >> .env
          echo "EXPO_PUBLIC_PROJECT_ID=${{ secrets.EXPO_PUBLIC_PROJECT_ID }}" >> .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version from app.config.js
        id: version
        run: |
          VERSION=$(node -e "const c = require('./app.config.js').default || require('./app.config.js'); console.log(c.expo.version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk hisaab-v${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: frontend/hisaab-v${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Hisaab v${{ steps.version.outputs.version }}"
          body: |
            ## Hisaab v${{ steps.version.outputs.version }}

            **Commit:** ${{ github.sha }}
            **Build:** #${{ github.run_number }}

            ### Installation
            1. Download `hisaab-v${{ steps.version.outputs.version }}.apk` below
            2. Enable "Install from unknown sources" if prompted
            3. Install the APK
          files: |
            frontend/hisaab-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
